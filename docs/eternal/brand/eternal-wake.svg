<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200">
<title>Eternal</title>
<defs><linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F7FA"/><stop offset="0.48" stop-color="#AEB8C2"/><stop offset="0.52" stop-color="#5B636C"/><stop offset="1" stop-color="#C9D1D9"/></linearGradient></defs>
<style>
.half{stroke-dasharray:140;stroke-dashoffset:140;animation:half 1.8s ease-in-out .5s forwards}
.e{stroke-dasharray:40;stroke-dashoffset:40;animation:e .6s ease-out 2.3s forwards}
.glint{opacity:0;animation:glint .45s ease-out 2.9s forwards}
@keyframes half{to{stroke-dashoffset:0}}
@keyframes e{to{stroke-dashoffset:0}}
@keyframes glint{50%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.half,.e{animation:none;stroke-dashoffset:0}.glint{animation:none}}
</style>
<rect width="620" height="200" fill="#000000"/>
<text x="308" y="98" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="32" letter-spacing="11" fill="url(#chrome)">ETERNAL</text>
<g fill="none" stroke="#3A3F46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M170 122 H450"/><path d="M310 122 V140 H321 M310 131 H319"/></g>
<g fill="none" stroke="#D7263D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M170 122 H310" class="half"/>
<path d="M450 122 H310" class="half"/>
<path d="M310 122 V140 H321 M310 131 H319" class="e"/>
</g>
<path d="M310 122 V140 H321 M310 131 H319" fill="none" stroke="#FF8A96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="glint"/>
</svg>
