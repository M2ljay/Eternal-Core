# Eternal Core: builds Core-Setup.exe on Windows (plus a Playhub-Setup.exe copy for Mark I/II updaters).
# - Every push to main or a mark-* branch, and manual runs: build and upload the installer as a workflow artifact.
# - Pushing a tag vX.Y.Z or a mark-* branch: the same, then create or refresh a DRAFT GitHub release
#   v<EternalRelease.Version> with the installer attached (a published release is never changed).
#   Nothing reaches installed copies until you publish the draft (the updater reads releases/latest, which
#   ignores drafts and prereleases).
# Forks have Actions disabled by default: enable them under the repository's Actions tab first.
name: Eternal Core installer

on:
  push:
    branches: [main, 'mark-*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eternal-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # The release packager verifies SHA-256 pins of bundled text files (Decky manifest, svcl readme, ...)
      # that were taken from CRLF working copies. A checkout with LF endings fails those checks.
      - name: Use Windows line endings
        run: git config --global core.autocrlf true

      # The repository is ~2.8 GB, mostly assets/on-this-day (served from GitHub raw, not built in).
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            Source
            catalog

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read release identity
        id: release
        shell: pwsh
        run: |
          $source = Get-Content -Raw Source/Shared/EternalRelease.cs
          $version = [regex]::Match($source, 'const string Version = "([0-9]+\.[0-9]+\.[0-9]+)";').Groups[1].Value
          $mark = [regex]::Match($source, 'const string MarkName = "([^"]+)";').Groups[1].Value
          if (!$version -or !$mark) { throw 'Could not read Source/Shared/EternalRelease.cs.' }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -cne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match EternalRelease.Version $version (expected v$version)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "mark=$mark" >> $env:GITHUB_OUTPUT
          Write-Host "Eternal Core $mark ($version)"

      # build-plugin.bat skips its own unpinned `npm install` when these shims already exist.
      - name: Install Decky plugin dependencies (lockfile)
        working-directory: Source/GamingModeDeckyPlugin
        run: |
          npm install -g pnpm@9
          pnpm install --frozen-lockfile

      - name: Release identity and update tests
        working-directory: Source/EternalRelease.Tests
        run: dotnet run -c Release

      # Mark II: anti-cheat safe mode detection and pause/resume orchestration (pure logic).
      - name: Anti-cheat safe mode tests
        working-directory: Source/AntiCheatProtection.Tests
        run: dotnet run -c Release

      # Every UI string must resolve in every language the app ships (missing ones fall back to Italian).
      - name: Localization resource tests
        working-directory: Source/LocalizationResource.Tests
        run: dotnet run -c Release

      # The Plugin Store never offers or installs an upstream update over the user's forks
      # (Source/Shared/ProtectedPluginForks.json), plus the upstream catalogue identity contracts.
      - name: Plugin store identity and fork protection tests
        working-directory: Source/Playhub.CatalogIdentity.Tests
        run: dotnet run -c Release

      - name: Plugin install payload and fork guard tests
        working-directory: Source/Playhub.BundledPlugin.Tests
        run: dotnet run -c Release

      - name: Big Picture plugin store tests (Decky plugin)
        working-directory: Source/GamingModeDeckyPlugin
        run: node --test tests/pluginStoreForks.test.mjs tests/pluginStoreOperations.test.mjs tests/pluginStoreCatalog.test.mjs

      # Upstream #22: Big Picture's Home/QAM must answer again after a non-Steam game exits.
      - name: Big Picture menu regression tests (Decky plugin)
        working-directory: Source/GamingModeDeckyPlugin
        run: node --test tests/steamOwnedLaunchDispatcher.test.mjs tests/controlledQamIntegration.test.mjs

      # Mark III: TV protocol and policy (against a fake TV), Steam update hold and client backup,
      # Decky heartbeat health, boot sequence decisions and the agent's 12-language text.
      - name: Mark III tests
        working-directory: Source/MarkIII.Tests
        run: dotnet run -c Release

      - name: Mark III Big Picture plugin tests (heartbeat, Core Repair tile, optional startup, Health section)
        working-directory: Source/GamingModeDeckyPlugin
        run: node --test tests/coreHealth.test.mjs tests/optionalStartup.test.mjs tests/coreHealthSection.test.mjs

      # Core Health: reading the home server's core-status.json, every row's verdict and the notice
      # rules (once a day per problem; a dismissed problem returns only if it changes).
      - name: Core Health tests
        working-directory: Source/CoreHealth.Tests
        run: dotnet run -c Release

      # The agent's WPF and Windows code builds only here; fail fast before packaging.
      - name: Compile the Gaming Mode agent
        run: dotnet build Source/GamingModeAgent/GamingMode.csproj -c Release

      - name: Build installer
        shell: pwsh
        run: ./Source/PlayhubSetup/build-update-preview.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eternal-Core-${{ steps.release.outputs.version }}-installer
          path: |
            Source/PlayhubSetup/Output/Core-Setup.exe
            Source/PlayhubSetup/Output/Core-Setup.exe.sha256
          if-no-files-found: error

      # A tag push or any push to a mark-* branch leaves a DRAFT release for this version. Drafts create
      # their tag only when published, so a branch push can prepare a release without pushing a tag.
      # A release that is already published is never touched.
      - name: Create or refresh draft release
        if: github.ref_type == 'tag' || startsWith(github.ref_name, 'mark-')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v${{ steps.release.outputs.version }}'
          $assets = @('Source/PlayhubSetup/Output/Core-Setup.exe', 'Source/PlayhubSetup/Output/Core-Setup.exe.sha256',
            'Source/PlayhubSetup/Output/Playhub-Setup.exe', 'Source/PlayhubSetup/Output/Playhub-Setup.exe.sha256')
          $isDraft = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @assets --draft --target '${{ github.sha }}' `
              --title 'Eternal Core ${{ steps.release.outputs.mark }} (${{ steps.release.outputs.version }})' `
              --notes 'Eternal Core ${{ steps.release.outputs.mark }}, a fork of Playhub 3.0.0 by Andrea Sgarro (MIT).'
          } elseif ($isDraft -eq 'true') {
            gh release upload $tag @assets --clobber
            gh release edit $tag --target '${{ github.sha }}'
          } else {
            Write-Host "$tag is already published; leaving it alone."
          }
